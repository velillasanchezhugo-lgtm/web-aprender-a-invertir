name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:content
      - name: Origen y licencias de las dependencias
        run: npm run check:deps
      - run: npm run build
      # Informativo: Astro 5 arrastra avisos que solo se cierran con Astro 7 (ver docs/SEGURIDAD.md, punto 6).
      - name: Vulnerabilidades conocidas (npm audit)
        run: npm audit --omit=dev
        continue-on-error: true
