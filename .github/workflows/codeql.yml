# Análisis de código (CodeQL): busca fallos de seguridad en JavaScript/TypeScript y en los propios workflows.
# Si se activa la «configuración predeterminada» de CodeQL en GitHub, este archivo sobra: ver docs/SEGURIDAD.md.
name: CodeQL
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
